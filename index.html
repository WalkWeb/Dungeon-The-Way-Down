<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Dungeon: The Way Down</title>
    <link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div id="ui-wrapper">
    <canvas id="gameCanvas"></canvas>

    <aside id="side-panel">
        <div class="stat-box">
            <h2>Герой (@)</h2>
            <div class="hp-container">
                <div id="hp-bar"></div>
                <span id="hp-text">100 / 100</span>
            </div>
            <p>Урон: <span id="atk-val">10</span></p>
        </div>
        <div class="inventory-box">
            <h3>Инвентарь</h3>
            <ul id="inventory-list">
                <!-- Items here -->
            </ul>
        </div>
        <div class="log-box">
            <h3>Журнал событий</h3>
            <div id="event-log">
                <!-- Logs here -->
            </div>
        </div>
    </aside>
</div>
<div id="inventory-overlay" class="hidden">
    <div id="character-panel" class="inventory-half">
        <h3>Характеристики</h3>
        <ul id="container-list"></ul>
    </div>
    <div id="player-inventory-panel" class="inventory-half">
        <h3>Инвентарь</h3>
        <ul id="full-inventory-list"></ul>
    </div>
</div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
